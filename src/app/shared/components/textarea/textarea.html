<div class="app-field">
  <label [for]="id" class="app-field__label">{{ label() }}</label>
  <textarea
    [id]="id"
    class="app-field__control"
    [class.app-field__control--invalid]="errorMessage()"
    [placeholder]="placeholder()"
    [rows]="rows()"
    [disabled]="disabled()"
    [value]="value()"
    [attr.aria-invalid]="errorMessage() ? true : null"
    [attr.aria-describedby]="errorMessage() ? id + '-error' : hint() ? id + '-hint' : null"
    (input)="handleInput($event)"
    (blur)="handleBlur()"
  ></textarea>
  @if (errorMessage(); as message) {
    <p [id]="id + '-error'" class="app-field__error" role="alert">{{ message }}</p>
  } @else if (hint(); as hintText) {
    <p [id]="id + '-hint'" class="app-field__hint">{{ hintText }}</p>
  }
</div>
