<div class="empty-state">
  <app-icon [name]="icon()" [size]="48" class="empty-state__icon" />
  <p class="empty-state__title">{{ title() }}</p>
  @if (message()) {
    <p class="empty-state__message">{{ message() }}</p>
  }
  @if (actionLabel()) {
    <app-button (pressed)="actionPressed.emit()">{{ actionLabel() }}</app-button>
  }
</div>
