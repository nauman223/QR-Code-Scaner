<div class="app-chips" role="radiogroup" [attr.aria-label]="ariaLabel() || null">
  @for (option of options(); track option.value) {
    <button
      type="button"
      class="app-chips__item"
      [class.app-chips__item--active]="option.value === value()"
      role="radio"
      [attr.aria-checked]="option.value === value()"
      [disabled]="disabled()"
      (click)="select(option.value)"
    >
      {{ option.label }}
    </button>
  }
</div>
