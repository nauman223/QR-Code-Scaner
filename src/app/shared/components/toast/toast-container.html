<div class="app-toast-container" aria-live="polite" role="status">
  @for (toast of toasts(); track toast.id) {
    <div class="app-toast">
      <span class="app-toast__text">{{ toast.text }}</span>
      @if (toast.action; as action) {
        <button type="button" class="app-toast__action" (click)="handleAction(toast)">
          {{ action.label }}
        </button>
      }
      <button
        type="button"
        class="app-toast__close"
        aria-label="Dismiss"
        (click)="dismiss(toast.id)"
      >
        <app-icon name="close" [size]="16" />
      </button>
    </div>
  }
</div>
